    <title>Document</title>
    <style>
        body{
            background: aquamarine;
        }
        @media (min-width:900px){
            body{

            }
            p{

            border: 1px solid #000;
            padding: 8px;
            border-radius: 15px;
        }

            display:grid;
        }

</head>

</html>
